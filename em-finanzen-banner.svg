<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1929"/>
      <stop offset="50%" stop-color="#111d2e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="crownB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="lineB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&amp;family=DM+Sans:wght@400;500;600&amp;display=swap');
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bannerBg)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <rect width="60" height="60" fill="none" stroke="#1e293b" stroke-width="0.5"/>
  </pattern>
  <rect width="1500" height="500" fill="url(#grid)" opacity="0.3"/>
  
  <!-- Crown -->
  <path d="M680 155 L700 115 L712 135 L750 95 L788 135 L800 115 L820 155" 
        stroke="url(#crownB)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="700" cy="112" r="3.5" fill="#60a5fa"/>
  <circle cx="750" cy="92" r="4.5" fill="#93c5fd"/>
  <circle cx="800" cy="112" r="3.5" fill="#60a5fa"/>
  
  <!-- EM -->
  <text x="750" y="280" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="130" letter-spacing="12" fill="#e2e8f0">EM</text>
  
  <!-- Gradient underline -->
  <rect x="640" y="298" width="220" height="4" rx="2" fill="url(#lineB)"/>
  
  <!-- FINANZEN -->
  <text x="750" y="340" text-anchor="middle" font-family="'DM Sans', sans-serif" font-weight="600" font-size="22" letter-spacing="8" fill="#94a3b8">FINANZEN</text>
  
  <!-- Tagline -->
  <text x="750" y="375" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="600" font-size="16" letter-spacing="1.5" fill="#475569" font-style="italic">Dein Weg. Deine Zukunft.</text>
  
  <!-- Accent lines left and right -->
  <line x1="200" y1="250" x2="580" y2="250" stroke="#1e293b" stroke-width="1"/>
  <line x1="920" y1="250" x2="1300" y2="250" stroke="#1e293b" stroke-width="1"/>
</svg>

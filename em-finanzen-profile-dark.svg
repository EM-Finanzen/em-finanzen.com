<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="crownS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="lineS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&amp;display=swap');
    </style>
  </defs>
  
  <!-- Background circle -->
  <circle cx="200" cy="200" r="200" fill="url(#bgGrad)"/>
  
  <!-- Crown -->
  <path d="M155 140 L172 105 L183 122 L200 90 L217 122 L228 105 L245 140" 
        stroke="url(#crownS)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="172" cy="102" r="4" fill="#60a5fa"/>
  <circle cx="200" cy="87" r="5" fill="#93c5fd"/>
  <circle cx="228" cy="102" r="4" fill="#60a5fa"/>
  
  <!-- EM text -->
  <text x="200" y="252" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="140" letter-spacing="12" fill="#ffffff">EM</text>
  
  <!-- Gradient underline -->
  <rect x="115" y="270" width="170" height="4.5" rx="2.25" fill="url(#lineS)"/>
</svg>

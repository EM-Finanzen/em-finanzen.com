  <!-- Gradient underline -->
  <rect x="95" y="132" width="110" height="3" rx="1.5" fill="url(#lineGradD)"/>
  
  <!-- FINANZEN -->
  <text x="150" y="162" text-anchor="middle" font-family="'DM Sans', sans-serif" font-weight="600" font-size="16" letter-spacing="6" fill="#cbd5e1">FINANZEN</text>
  

  <circle cx="134" cy="16" r="2.5" fill="#60a5fa"/>
  <circle cx="150" cy="6" r="3" fill="#93c5fd"/>
  <circle cx="166" cy="16" r="2.5" fill="#60a5fa"/>
  
  <!-- EM text -->
